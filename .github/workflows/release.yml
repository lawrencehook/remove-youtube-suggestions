name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Check release versions
        run: python3 scripts/check-release.py "$GITHUB_REF_NAME"

      - name: Test extension
        run: npm test
        working-directory: tests

      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Test server
        run: npm test
        working-directory: server

      - name: Install web-ext
        run: npm install -g web-ext

      - name: Build Firefox zip
        run: ./firefox.sh

      - name: Build Chrome zip
        run: ./chrome.sh

      - name: Stage release assets
        run: |
          mkdir -p dist
          cp src/web-ext-artifacts/*.zip "dist/rys-firefox-${GITHUB_REF_NAME}.zip"
          cp extension.zip "dist/rys-chrome-${GITHUB_REF_NAME}.zip"

      - name: Validate release ZIPs
        run: python3 scripts/check-release.py "$GITHUB_REF_NAME" "dist/rys-chrome-${GITHUB_REF_NAME}.zip" "dist/rys-firefox-${GITHUB_REF_NAME}.zip"

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.zip
          fail_on_unmatched_files: true
